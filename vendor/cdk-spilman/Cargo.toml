[package]
name = "cdk-spilman"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Standalone Spilman payment channels library for Cashu"
rust-version = "1.85.0"

[features]
default = []
wallet = ["cashu/wallet"]
configurable-host = ["dep:yaml_serde", "dep:rusqlite"]
configurable-host-reqwest = ["configurable-host", "dep:reqwest", "dep:tokio"]
spilman-axum = ["configurable-host", "dep:axum"]
client-sqlite = ["dep:rusqlite"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8.9", optional = true, features = ["macros", "ws"] }
base64 = "0.22"
bitcoin = { version = "0.32.9", features = ["base64", "serde", "rand", "rand-std"] }
bls12_381 = "0.8"
cashu = { version = "=0.18.3", default-features = false }
hkdf = "0.12"
reqwest = { version = "0.12", optional = true, features = ["json"] }
rusqlite = { version = "0.31", optional = true, features = ["bundled"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
yaml_serde = { version = "0.10", optional = true }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1.43", optional = true, features = ["rt", "rt-multi-thread", "sync"] }
tracing = { version = "0.1", default-features = false, features = ["attributes", "log"] }
