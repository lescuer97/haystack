[package]
name = "cdk-wallet-browser"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Test fixture only; never enable in production builds.
local-mint-fixture = []

[dependencies]
cdk = { git = "https://github.com/cashubtc/cdk.git", tag = "v0.18.1", version = "=0.18.1", default-features = false, features = ["wallet"] }
cdk-common = { git = "https://github.com/cashubtc/cdk.git", tag = "v0.18.1", version = "=0.18.1", default-features = false, features = ["wallet"] }
cdk-spilman = { git = "https://github.com/SatsAndSports/cashu_spilman_channels", rev = "8a5350dfd4d7c2902dc15c726a91dbfb2c793d43", default-features = false, features = ["wallet"] }
safer-ffi = { version = "=0.1.13", features = ["proc_macros"] }
bip39 = { version = "=2.2.2", features = ["rand", "zeroize"] }
zeroize = "1"
hkdf = "=0.12.4"
sha2 = "=0.10.9"
url = "2"
uuid = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
futures = "0.3"
tokio = { version = "1", default-features = false, features = ["rt", "sync"] }
gloo-timers = { version = "0.3", features = ["futures"] }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-time = "1"
web-sys = { version = "0.3", features = ["Window", "Location", "Storage", "console"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[dev-dependencies]
cdk-common = { git = "https://github.com/cashubtc/cdk.git", tag = "v0.18.1", version = "=0.18.1", default-features = false, features = ["wallet", "test"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros"] }
paste = "1"
